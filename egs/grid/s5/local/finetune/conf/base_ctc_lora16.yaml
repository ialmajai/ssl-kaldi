# Rank-16 variant of base_ctc_lora.yaml (alpha 16, so the same scale 1.0); else identical.
# Adapted from av_hubert's finetune/base_vox_30h.yaml for one GPU: CTC head
# instead of seq2seq, encoder under no_grad for the first 3000 updates so the
# head learns first, then LoRA trains with the pretrained weights frozen.
# Checkpoint chosen by WER on held-out training speakers (s7, s30).
common:
  fp16: true
  log_format: json
  log_interval: 100
  seed: 1337
  user_dir: ???

checkpoint:
  save_interval: 1
  keep_last_epochs: 2
  best_checkpoint_metric: wer
  maximize_best_checkpoint_metric: false

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 1
  nprocs_per_node: 1

task:
  _name: av_hubert_pretraining
  is_s2s: false
  data: ???
  label_dir: ???
  normalize: true
  labels: ["ltr"]
  label_rate: -1
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  max_sample_size: 500
  modalities: ["video"]
  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 6
  max_tokens: 1000
  validate_interval: 1
  train_subset: train
  valid_subset: valid

criterion:
  _name: ctc
  zero_infinity: true
  post_process: letter

optimization:
  max_update: 15000
  lr: [0.0005]
  sentence_avg: true
  update_freq: [1]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 1500
  hold_steps: 6000
  decay_steps: 7500
  final_lr_scale: 0.05

model:
  _name: av_hubert_ctc_lora
  w2v_path: ???
  apply_mask: false
  layerdrop: 0.1
  dropout: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.0
  final_dropout: 0.1
  feature_grad_mult: 0.0
  freeze_finetune_updates: 3000
  lora_rank: 16
  lora_alpha: 16.0
  lora_targets: q_proj,k_proj,v_proj,out_proj,fc1,fc2

hydra:
  run:
    dir: ???
