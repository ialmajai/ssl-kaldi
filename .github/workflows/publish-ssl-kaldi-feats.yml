# Publish ssl-kaldi-feats to PyPI through Trusted Publishing (no API token).
# Push a tag ssl-kaldi-feats-vX.Y.Z whose version matches pyproject.toml.
name: publish-ssl-kaldi-feats

on:
  push:
    tags:
      - "ssl-kaldi-feats-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ssl-kaldi-feats
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#ssl-kaldi-feats-v}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$tag" = "$ver" ] || { echo "tag $tag does not match pyproject version $ver"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: packages/ssl-kaldi-feats/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssl-kaldi-feats
    permissions:
      id-token: write   # the OIDC token PyPI trusts; no stored secret
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
